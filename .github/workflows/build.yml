name: Build MiniAddonLoader

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Build
        run: gradle clean build --no-daemon

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: MiniAddonLoader-build
          path: |
            **/build/libs/*.jar
